<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabakal Gym - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-body">
    <div class="page-container">
        <!-- header: profile and welcome text -->
        <header class="home-header">
            <div>
                <h1>WELCOME, USER!</h1>
                <p>To Kabakal Gym, where your routines, your records, and your community—all in one place.</p>
            </div>
            <div class="profile-icon">👤</div> <!-- temporary icon, needs of change to show user profile -->
        </header>

        <!-- Search Bar -->
        <input type="search" placeholder="🔍 Browse" class="search-bar"> <!-- temporary icon for search bar, feel free to change if need be -->

        <!-- Stats Grid -->
        <section class="stats-grid">
            <div class="stat-card">4 Sessions</div>
            <div class="stat-card">7-Day Streak</div>
            <div class="stat-card">6 PM Session</div>
        </section>

        <!-- ad or photo/choice of exercise placeholder, this is optional -->
        <section class="ad-placeholder">
            <p>PLACEHOLDER SPACE</p>
        </section>

        <!-- quick actions -->
        <section class="quick-actions">
            <button class="btn">GENERATED WORKOUT</button>
            <button class="btn">VIEW NEW ROUTINES</button>
            <button class="btn">SCAN QR-CODE</button>
            <button class="btn">TIMER</button>
        </section>
    </div>

    <!-- bottom navigation bar -->
    <nav class="bottom-nav-bar">
        <a href="home.html" class="nav-items active">
            <img src="../assets/home-logo.png" alt="Home" class="icon">
            <span class="icon-label">HOME</span>
        </a>
        <a href="#" class="nav-items">
            <img src="../assets/calendar-logo.png" alt="Calendar" class="icon">
            <span class="icon-label">CALENDAR</span>
        </a>
        <img class="nav-logo-badge" src="../assets/kabakal-gym-logo.png" alt="Kabakal Gym Logo">
        <a href="billing.html" class="nav-items">
            <img src="../assets/bell-logo.png" alt="Bell" class="icon">
            <span class="icon-label">BILLING</span>
        </a>
        <a href="../Step_11/step11.html" class="nav-items">
            <img src="../assets/profile-logo.png" alt="Profile" class="icon">
            <span class="icon-label">PROFILE</span>
        </a>
    </nav>
</body>
</html>
