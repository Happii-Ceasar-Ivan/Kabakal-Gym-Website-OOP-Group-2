<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabakal Gym - Profile Page</title>
    <link rel="stylesheet" href="step11.css">
</head>

<body class="body">

    <div class="profile-container">
        
        <div class="header-background">
            <div class="header-arrow-container">
                <div class="header-arrow"></div>
            </div>
            
            <div class="avatar-wrapper">
                <div class="avatar-circle">
                    <div class="avatar-icon"></div>
                </div>
                <div class="camera-badge">
                    <i class="camera-icon"></i>
                </div>
            </div>
            
            <div class="profile-name">(FNAME) (LNAME)</div>
            <div class="profile-subtext-quote">"(Quote goes here)."</div>
        </div>

        <div class="setting-content">
            
            <div class="setting-group">
                <div class="setting-group-title">MEMBER PROFILE</div>
                <div class="setting-group-body">
                    <div class="info-row">
                        <span class="label">MEMBER ID:</span>
                        <span class="value asterisks">**** **** **</span>
                    </div>
                    <div class="info-row inline-row">
                        <span class="label">TIER:</span>
                        <span class="value">(Tier)</span>
                        <span class="divider">|</span>
                        <span class="label">STATUS:</span>
                        <span class="status-badge">(Status)</span>
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-group-title">ACCOUNT SETTINGS</div>
                <div class="setting-group-body">
                    <div class="menu-list">
                        <a href="#" class="menu-item">Edit Personal Information</a>
                        <a href="#" class="menu-item">Change Password</a>
                        <a href="#" class="menu-item">Manage Payment Methods</a>
                        <a href="#" class="menu-item">Notification Preferences</a>
                    </div>
                </div>
            </div>

            <button class="logout-btn">Log Out</button>

        </div>
    </div>

    <nav class="bottom-nav-bar">
        <a href="#" class="nav-items">
            <img src="../assets/home-logo.png" alt="Home" class="icon">
            <span class="icon-label">HOME</span>
        </a>

        <a href="#" class="nav-items">
            <img src="../assets/calendar-logo.png" alt="Calendar" class="icon">
            <span class="icon-label">CALENDAR</span>
        </a>

        <img class="nav-logo-badge" src="../assets/kabakal-gym-logo.png" alt="Kabakal Gym Logo">

        <a href="../Step_10/step10.html" class="nav-items">
            <img src="../assets/bell-logo.png" alt="Bell" class="icon">
            <span class="icon-label">BILLING</span>
        </a>

        <a href="#" class="nav-items nav-item active">
            <img src="../assets/profile-logo.png" alt="Profile" class="icon">
            <span class="icon-label">PROFILE</span>
        </a>
    </nav>

</body>
</html>
